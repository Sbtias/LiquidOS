<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiquidOS — Vista previa</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="dark">

  <!-- ============ Arranque (Plymouth) ============ -->
  <div class="boot" id="boot">
    <div class="boot-aurora"></div>
    <div class="boot-inner">
      <div class="boot-logo-wrap">
        <div class="boot-halo"></div>
        <svg class="boot-logo" viewBox="0 0 100 120" aria-hidden="true">
          <defs>
            <linearGradient id="dropGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#a9e6ff"/>
              <stop offset="42%" stop-color="#5aa9ff"/>
              <stop offset="100%" stop-color="#7b5cff"/>
            </linearGradient>
            <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="M50 4c14 22 34 44 34 66a34 34 0 1 1-68 0C16 48 36 26 50 4z" fill="url(#dropGrad)"/>
          <ellipse cx="37" cy="74" rx="9" ry="15" fill="url(#gloss)" transform="rotate(-20 37 74)"/>
        </svg>
      </div>
      <div class="boot-name">LiquidOS</div>
      <div class="boot-status" id="bootStatus">Iniciando el sistema…</div>
      <div class="boot-progress"><span id="bootBar"></span></div>
      <div class="boot-hint">Haz clic para entrar</div>
    </div>
  </div>

  <!-- ============ Escritorio ============ -->
  <div class="desktop" id="desktop">

    <div class="wall wall-dark" aria-hidden="true"></div>
    <div class="wall wall-light" aria-hidden="true"></div>

    <header class="menubar" id="menubar">
      <div class="menubar-left">
        <button class="apple" id="appleBtn" title="Menú de LiquidOS" aria-label="Menú de LiquidOS">
          <svg viewBox="0 0 100 120" aria-hidden="true"><path d="M50 4c14 22 34 44 34 66a34 34 0 1 1-68 0C16 48 36 26 50 4z" fill="currentColor"/></svg>
        </button>
        <span class="app-name">Escritorio</span>
        <nav class="menus">
          <button data-menu="Archivo">Archivo</button>
          <button data-menu="Editar">Editar</button>
          <button data-menu="Ver">Ver</button>
          <button data-menu="Ventana">Ventana</button>
          <button data-menu="Ayuda">Ayuda</button>
        </nav>
      </div>
      <div class="menubar-right">
        <button class="status" id="batteryBtn" title="Batería 87%">
          <svg viewBox="0 0 26 14"><rect x="1" y="1.5" width="21" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="3.5" width="15" height="7" rx="1.6" fill="currentColor"/><path d="M23.5 5v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button class="status" id="wifiBtn" title="Wi-Fi: liquido-5G">
          <svg viewBox="0 0 24 18"><path d="M2 6.4a15 15 0 0 1 20 0M5.4 9.8a10 10 0 0 1 13.2 0M8.7 13.2a5.5 5.5 0 0 1 6.6 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="16.2" r="1.4" fill="currentColor"/></svg>
        </button>
        <button class="status" id="searchBtn" title="Buscar (Ctrl+Espacio)">
          <svg viewBox="0 0 20 20"><circle cx="8.6" cy="8.6" r="5.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12.8 12.8 17 17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <button class="status" id="controlBtn" title="Centro de control">
          <svg viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="6.4" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="6.2" cy="4.2" r="1.7" fill="currentColor"/><rect x="1" y="9.6" width="20" height="5.4" rx="2.7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="15.6" cy="12.3" r="1.4" fill="currentColor"/></svg>
        </button>
        <button class="status clock" id="clock">—</button>
      </div>
    </header>

    <main class="windows" id="windows"></main>

    <div class="dock-wrap">
      <div class="dock" id="dock" aria-label="Dock"></div>
    </div>

    <div class="spotlight" id="spotlight" hidden>
      <div class="spot-box">
        <div class="spot-input">
          <svg viewBox="0 0 20 20"><circle cx="8.6" cy="8.6" r="5.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12.8 12.8 17 17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <input id="spotInput" type="text" placeholder="Buscar apps, ajustes y archivos" autocomplete="off" spellcheck="false">
          <kbd>esc</kbd>
        </div>
        <ul class="spot-results" id="spotResults"></ul>
        <div class="spot-foot">
          <span><kbd>↑</kbd><kbd>↓</kbd> navegar</span>
          <span><kbd>↵</kbd> abrir</span>
          <span class="spot-brand">LiquidOS Spotlight</span>
        </div>
      </div>
    </div>

    <div class="control-center" id="controlCenter" hidden>
      <div class="cc-grid">
        <button class="cc-tile" data-toggle="wifi" data-on="true">
          <span class="cc-ico">
            <svg viewBox="0 0 24 18"><path d="M2 6.4a15 15 0 0 1 20 0M5.4 9.8a10 10 0 0 1 13.2 0M8.7 13.2a5.5 5.5 0 0 1 6.6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.2" r="1.4" fill="currentColor"/></svg>
          </span>
          <span class="cc-txt"><b>Wi-Fi</b><small>liquido-5G</small></span>
        </button>
        <button class="cc-tile" data-toggle="bt">
          <span class="cc-ico">
            <svg viewBox="0 0 16 24"><path d="M4 6.5 12 17l-4 3V4l4 3L4 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>
          </span>
          <span class="cc-txt"><b>Bluetooth</b><small>Apagado</small></span>
        </button>
        <button class="cc-tile" data-toggle="dnd">
          <span class="cc-ico">
            <svg viewBox="0 0 24 24"><path d="M6 16V10a6 6 0 0 1 12 0v6l2 2H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          </span>
          <span class="cc-txt"><b>No molestar</b><small>Desactivado</small></span>
        </button>
        <button class="cc-tile" id="ccThemeTile" data-on="true" title="Cambiar apariencia">
          <span class="cc-ico">
            <svg viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.6 8.6 0 1 0 20.5 14.2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          </span>
          <span class="cc-txt"><b>Apariencia</b><small id="appearanceLabel">Oscuro</small></span>
        </button>
      </div>

      <div class="cc-appearance">
        <span class="cc-section">Tema del sistema</span>
        <div class="seg cc-seg">
          <button data-theme="light">Claro</button>
          <button data-theme="dark" class="on">Oscuro</button>
        </div>
      </div>

      <div class="cc-slider">
        <label>Brillo</label>
        <input type="range" min="30" max="100" value="88" id="brightness">
      </div>
      <div class="cc-slider">
        <label>Volumen</label>
        <input type="range" min="0" max="100" value="45" id="volume">
      </div>

      <footer class="cc-foot">LiquidOS 1.0 · “Torrente”</footer>
    </div>

    <div class="menu-pop" id="menuPop" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </div>

<script src="app.js"></script>
</body>
</html>
