<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2400" viewBox="0 0 3840 2400">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>

    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5b4bff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#3a2bd6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3a2bd6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#29d3d0" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#128a94" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#128a94" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3f8dff" stop-opacity="0.60"/>
      <stop offset="60%" stop-color="#1d4fa8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#1d4fa8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="g4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff7ac8" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#a0308c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a0308c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.78">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="200"/>
    </filter>
  </defs>

  <rect width="3840" height="2400" fill="url(#base)"/>

  <g filter="url(#softer)">
    <ellipse cx="1180" cy="620" rx="1080" ry="820" fill="url(#g2)"/>
    <ellipse cx="3060" cy="1760" rx="1320" ry="1020" fill="url(#g1)"/>
    <ellipse cx="3360" cy="420" rx="900" ry="760" fill="url(#g3)"/>
    <ellipse cx="760" cy="2020" rx="980" ry="700" fill="url(#g4)"/>
  </g>

  <g filter="url(#soft)" opacity="0.55">
    <ellipse cx="2400" cy="1200" rx="900" ry="600" fill="url(#g3)"/>
  </g>

  <!-- Vetas de cristal líquido -->
  <g fill="none" stroke="url(#sheen)" stroke-linecap="round">
    <path d="M-200 1480 C 700 1180, 1250 1720, 2100 1460 S 3600 1080, 4100 1400" stroke-width="3" opacity="0.5"/>
    <path d="M-200 1560 C 720 1270, 1280 1790, 2140 1530 S 3620 1160, 4100 1470" stroke-width="2" opacity="0.35"/>
    <path d="M-200 1720 C 780 1430, 1180 1900, 2000 1680 S 3500 1330, 4100 1620" stroke-width="1.6" opacity="0.22"/>
  </g>

  <rect width="3840" height="2400" fill="url(#vignette)"/>

  <!-- Disco de luz superior -->
  <ellipse cx="1920" cy="-320" rx="1500" ry="560" fill="#8fc4ff" opacity="0.10" filter="url(#softer)"/>
</svg>
