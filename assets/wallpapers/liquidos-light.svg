      <stop offset="100%" stop-color="#d8c4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8fd8ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#b6e6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b6e6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffc0d4" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#ffd6e3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd6e3" stop-opacity="0"/>
    </radialGradient>
