# ============================================================
# LiquidOS 1.0 — menú de arranque UEFI del medio live
# (mismo contenido que la variante BIOS/CSM)
# ============================================================

set default="0"
set timeout=4

insmod all_video
insmod gfxterm
insmod png
set gfxpayload=keep
set gfxmode=1920x1080,1680x1050,1366x768,auto
terminal_output gfxterm

if [ -f /boot/grub/themes/liquidos/theme.txt ]; then
    set theme=/boot/grub/themes/liquidos/theme.txt
    export theme
fi

menuentry "LiquidOS 1.0 «Torrente» — Iniciar" --class liquidos --class os {
    linux /live/vmlinuz boot=live components quiet splash loglevel=3 vt.global_cursor_default=0
    initrd /live/initrd.img
}

menuentry "LiquidOS 1.0 — Modo seguro (gráficos básicos)" --class liquidos {
    linux /live/vmlinuz boot=live components nomodeset quiet splash vt.global_cursor_default=0
    initrd /live/initrd.img
}

menuentry "LiquidOS 1.0 — Diagnóstico (sin splash)" --class liquidos {
    linux /live/vmlinuz boot=live components loglevel=7
    initrd /live/initrd.img
}
