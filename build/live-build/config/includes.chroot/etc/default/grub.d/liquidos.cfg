# LiquidOS — parámetros de GRUB
GRUB_DISTRIBUTOR="LiquidOS"
GRUB_TIMEOUT=4
GRUB_TIMEOUT_STYLE="menu"
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 vt.global_cursor_default=0"
GRUB_CMDLINE_LINUX=""
GRUB_THEME="/boot/grub/themes/liquidos/theme.txt"
GRUB_DISABLE_OS_PROBER=false
GRUB_DISABLE_SUBMENU=y

# Arranque gráfico nítido: mantiene el modo de vídeo de GRUB
# hasta que Plymouth toma el control (sin parpadeos ni texto).
GRUB_GFXMODE="1920x1080,1680x1050,1366x768,auto"
GRUB_GFXPAYLOAD_LINUX="keep"
GRUB_TERMINAL="gfxterm"
