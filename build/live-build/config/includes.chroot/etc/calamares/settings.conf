# ============================================================
# LiquidOS — configuración de Calamares (instalador)
# Estado: experimental. Pruébalo siempre en una máquina virtual.
# ============================================================

modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: unpackfs
    module: unpackfs
    config: unpackfs.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - grubcfg
      - bootloader
      - plymouthcfg
      - initramfs
      - umount
  - show:
      - finished

branding: liquidos

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
