name: Construir ISO

# Genera la ISO de LiquidOS en la nube y la deja como artefacto
# descargable. No hace falta Linux, Docker ni permisos de admin
# en tu equipo: GitHub ejecuta la compilación por ti.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de LiquidOS (p. ej. 1.0)"
        required: false
        default: "1.0"
      arch:
        description: "Arquitectura"
        required: false
        default: "amd64"
        type: choice
        options:
          - amd64
  push:
    branches: [main]
    paths:
      - "build/**"
      - "branding/**"
      - "assets/**"
      - "desktop/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"
  release:
    types: [published]

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ISO (Debian 12 · ${{ inputs.arch || 'amd64' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      DEBIAN_FRONTEND: noninteractive
      LIQUIDOS_VERSION: ${{ inputs.version || '1.0' }}
      LIQUIDOS_ARCH: ${{ inputs.arch || 'amd64' }}
      # Si defines el secreto SUPABASE_URL, la ISO también se registra en
      # Supabase para que la vista previa muestre la descarga real.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Verificar la configuración
        run: |
          set -e
          bash -n build/build-iso.sh
          bash -n scripts/verificar-uso-diario.sh
          bash -n scripts/publicar-descarga.sh
          node --check preview/app.js
          node --check scripts/preview.mjs
          for h in build/live-build/config/hooks/normal/*.hook.chroot; do
            echo "Sintaxis: $h"
            bash -n "$h"
          done
          for f in \
            build/live-build/config/includes.chroot/usr/local/sbin/liquidos-firstboot \
            build/live-build/config/includes.chroot/etc/systemd/system/liquidos-firstboot.service \
            build/live-build/config/includes.chroot/etc/polkit-1/rules.d/49-liquidos-live.rules \
            build/live-build/config/package-lists/liquidos.list.chroot; do
            test -s "$f" || { echo "Falta o está vacío: $f"; exit 1; }
          done
          grep -q '^packagekit$' build/live-build/config/package-lists/liquidos.list.chroot
          grep -q 'liquidos-firstboot' build/live-build/config/hooks/normal/0350-liquidos-daily.hook.chroot
          grep -q 'liquidos-verificar' build/build-iso.sh
          echo "Configuración verificada"

      - name: Liberar espacio en disco
        run: |
          echo "Espacio inicial:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          echo "Espacio tras la limpieza:"
          df -h /

      - name: Instalar live-build y utilidades
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools zstd \
            mtools dosfstools isolinux syslinux-common syslinux-efi \
            grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed \
            shim-signed debian-archive-keyring rsync git ca-certificates
          lb --version

      - name: Construir la ISO
        run: |
          sudo --preserve-env=LIQUIDOS_VERSION,LIQUIDOS_ARCH \
            env LIQUIDOS_VERSION="$LIQUIDOS_VERSION" LIQUIDOS_ARCH="$LIQUIDOS_ARCH" \
            ./build/build-iso.sh

      - name: Reunir resultados
        run: |
          ls -lh dist/
          cat dist/*.sha256

      - name: Preparar la descarga (partes si supera 2 GiB)
        id: assets
        run: |
          set -euo pipefail
          iso=$(find dist -maxdepth 1 -name '*.iso' -print -quit)
          [ -n "$iso" ] || { echo "No se encontró ninguna ISO en dist/"; exit 1; }
          size=$(stat -c%s "$iso")
          split=false
          if [ "$size" -ge 2000000000 ]; then
            split=true
            rm -f "${iso}.part"*
            split -b 1900M -d -a 2 --numeric-suffixes=1 "$iso" "${iso}.part"
            name=$(basename "$iso")
            {
              echo "LiquidOS se distribuye en partes porque la ISO supera el límite de 2 GiB"
              echo "por archivo de GitHub Releases."
              echo
              echo "Únelas en orden y comprueba la suma:"
              echo
              echo "  cat ${name}.part* > ${name}"
              echo "  sha256sum -c ${name}.sha256"
              echo
              echo "En Windows (PowerShell):"
              echo
              echo "  Get-Content ${name}.part* -AsByteStream |"
              echo "    Set-Content ${name} -AsByteStream"
              echo
              echo "Después puedes montar la ISO o grabarla con Rufus en modo DD."
            } > dist/LEEME-descarga.txt
          fi
          echo "split=$split" >> "$GITHUB_OUTPUT"
          echo "ISO: $size bytes · partes: $split"

      - name: Publicar la descarga en Supabase
        id: publicar
        # Solo si el repositorio tiene configurado SUPABASE_URL.
        if: ${{ env.SUPABASE_URL != '' }}
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          iso=$(find dist -maxdepth 1 -name '*.iso' -print -quit)
          [ -n "$iso" ] || { echo "No se encontró ninguna ISO en dist/"; exit 1; }
          source="artifact"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          download_url="$run_url"
          parts=()
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            source="release"
            if [[ "${{ steps.assets.outputs.split }}" == "true" ]]; then
              download_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
              for p in dist/*.part*; do
                parts+=(
                  --part
                  "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$p")"
                )
              done
            else
              download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$iso")"
            fi
          fi
          args=(
            "$iso"
            --version "$LIQUIDOS_VERSION"
            --arch "$LIQUIDOS_ARCH"
            --source "$source"
            --run-url "$run_url"
            --download-url "$download_url"
          )
          if [ "${#parts[@]}" -gt 0 ]; then
            args+=("${parts[@]}")
          fi
          bash scripts/publicar-descarga.sh "${args[@]}"
          {
            echo "### Descarga registrada"
            echo ""
            echo "- Versión: \`${LIQUIDOS_VERSION}\`"
            echo "- Binario: $download_url"
            echo "- Partes: ${{ steps.assets.outputs.split }}"
            echo "- Registro: Supabase · \`public.liquidos_releases\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar la ISO como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: liquidos-${{ env.LIQUIDOS_VERSION }}-${{ env.LIQUIDOS_ARCH }}
          path: |
            dist/*.iso
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Adjuntar a la release (solo etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.iso
            dist/*.sha256
            dist/*.part*
            dist/LEEME-descarga.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
